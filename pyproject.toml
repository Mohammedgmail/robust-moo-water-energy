[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sbrmoa"
version = "0.1.0"
description = "Scenario-based robust multi-objective planning of solar water-energy systems under deep uncertainty (Pyomo + HiGHS)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohammed Alfandi" }]
requires-python = ">=3.10"
dependencies = ["pyomo>=6.7", "highspy>=1.7", "numpy>=1.23", "pandas>=1.5", "pyyaml>=6"]
keywords = ["robust-optimization", "multi-objective", "water-energy-nexus", "pyomo", "cvar", "solar-pumping"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
dev = ["sbrmoa[plot]", "pytest>=7", "ruff==0.16.8"]

[project.urls]
Homepage = "https://github.com/Mohammedgmail/robust-moo-water-energy"
Paper = "https://doi.org/10.1016/j.jclepro.2026.149516"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
